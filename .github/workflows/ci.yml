name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (core + runtime, onnxruntime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra server --locked # CPU torch is enough for tests
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -q

  runtime-arm64:
    name: Python runtime on aarch64 (ARM kernels, as on a Raspberry Pi)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # Raspberry Pi OS
      - run: pip install -r runtime/requirements.txt pytest # the device kit's own install
      - run: python -m pytest -q runtime/tests

  js:
    name: JS runtime (onnxruntime-web wasm under Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @wwd/runtime test
      - run: pnpm --filter @wwd/web test # unit tests; the fixture-based ones run in the browsers job

  browsers:
    name: Browsers (Chromium, Firefox, WebKit; the static app, training in the browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra server --locked # the tiny base model and its web assets
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv run python -m scripts.make_web_fixtures
      - run: pnpm --filter @wwd/web test # the ported maths against Python, a whole training in Node
      - run: pnpm --filter @wwd/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @wwd/web test:e2e
